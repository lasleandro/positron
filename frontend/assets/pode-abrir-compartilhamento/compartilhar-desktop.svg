<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="392" viewBox="0 0 1100 392" role="img" aria-labelledby="t d" xml:lang="pt-BR"><title id="t">Duas formas de compartilhar seus documentos</title><desc id="d">Você adiciona seus arquivos ao pode abrir. Há dois caminhos. Você escolhe os documentos, gera um link de curta duração e o envia. Ou a pessoa pede acesso em podeabrir.com/@minhaarroba e você escolhe quais documentos liberar. Nos dois casos, o acesso é imediato, online ou presencialmente.</desc><rect x="0" y="0" width="1100" height="392" rx="0" fill="#FAF7F0" stroke="none" stroke-width="1.4"/><rect x="287" y="16" width="526" height="70" rx="12" fill="#FFFDF8" stroke="#DCD4C6" stroke-width="1.4"/><g transform="translate(311 30) scale(1)"><rect x="0" y="0" width="42" height="42" rx="10" fill="#F8E9DA" stroke="none" stroke-width="1.4"/><rect x="9" y="12" width="19" height="23" rx="2" fill="none" stroke="#5D584F" stroke-width="1.7"/><path d="M15 7 H28 L35 14 V30 H15 Z" fill="#FFFDF8" stroke="#2C2923" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 7 V14 H35 M20 19 H29 M20 23 H27" fill="none" stroke="#2C2923" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="368" y="59" text-anchor="start" fill="#2C2923" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="21">Você adiciona seus arquivos ao pode abrir</text><path d="M550 86 V110 M284 134 V118 Q284 110 292 110 H808 Q816 110 816 118 V134" fill="none" stroke="#A58668" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="550" cy="110" r="3" fill="#A58668"/><path d="M280 130 L284 134 L288 130 M812 130 L816 134 L820 130" fill="none" stroke="#A58668" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="143" width="502" height="170" rx="13" fill="#FFFDF8" stroke="#DCD4C6" stroke-width="1.4"/><g transform="translate(56 164) scale(0.88)"><rect x="0" y="0" width="42" height="42" rx="10" fill="#F8E9DA" stroke="none" stroke-width="1.4"/><path d="M18 18 L22 14 C29 7 38 16 31 23 L27 27 M25 25 L21 29 C14 36 5 27 12 20 L16 16 M17 25 L26 16" fill="none" stroke="#A84D23" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="107" y="191" text-anchor="start" fill="#2C2923" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="26">Você envia um link</text><rect x="566" y="143" width="502" height="170" rx="13" fill="#FFFDF8" stroke="#DCD4C6" stroke-width="1.4"/><g transform="translate(590 164) scale(0.88)"><rect x="0" y="0" width="42" height="42" rx="10" fill="#F8E9DA" stroke="none" stroke-width="1.4"/><path d="M7 11 Q7 9 10 9 H32 Q35 9 35 12 V25 Q35 28 32 28 H20 L13 34 V28 H10 Q7 28 7 25 Z" fill="none" stroke="#A84D23" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 18 H28 M21 14 V22" fill="none" stroke="#A84D23" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="641" y="191" text-anchor="start" fill="#2C2923" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="26">A pessoa pede acesso</text><text x="57" y="235" text-anchor="start" fill="#5D584F" font-family="Arial, Liberation Sans, sans-serif" font-weight="400" font-size="20">Você escolhe os documentos e gera um link</text><text x="57" y="264" text-anchor="start" fill="#5D584F" font-family="Arial, Liberation Sans, sans-serif" font-weight="400" font-size="20">de curta duração para enviar à pessoa.</text><text x="591" y="234" text-anchor="start" fill="#5D584F" font-family="Arial, Liberation Sans, sans-serif" font-weight="400" font-size="20">A pessoa solicita acesso pelo seu endereço</text><text x="591" y="260" text-anchor="start" fill="#2C2923" font-family="Liberation Mono, Courier New, monospace" font-weight="700" font-size="19">podeabrir.com/@minhaarroba</text><text x="591" y="291" text-anchor="start" fill="#5D584F" font-family="Arial, Liberation Sans, sans-serif" font-weight="400" font-size="20">Você escolhe quais documentos liberar.</text><text x="550" y="235" text-anchor="middle" fill="#A84D23" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="14">ou</text><g transform="translate(308 345) scale(0.89)"><path d="M7 2 H17 L13 10 H20 L8 23 L10 14 H4 Z" fill="#F8E9DA" stroke="#A84D23" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="564" y="363" text-anchor="middle" fill="#2C2923" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="21">Acesso imediato, online ou presencialmente.</text></svg>
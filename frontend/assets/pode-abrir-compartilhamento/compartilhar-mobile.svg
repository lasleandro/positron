<svg xmlns="http://www.w3.org/2000/svg" width="380" height="511" viewBox="0 0 380 511" role="img" aria-labelledby="t d" xml:lang="pt-BR"><title id="t">Duas formas de compartilhar seus documentos</title><desc id="d">Você adiciona seus arquivos ao pode abrir. Há dois caminhos. Você escolhe os documentos, gera um link de curta duração e o envia. Ou a pessoa pede acesso em podeabrir.com/@minhaarroba e você escolhe quais documentos liberar. Nos dois casos, o acesso é imediato, online ou presencialmente.</desc><rect x="0" y="0" width="380" height="511" rx="0" fill="#FAF7F0" stroke="none" stroke-width="1.4"/><rect x="12" y="10" width="356" height="71" rx="11" fill="#FFFDF8" stroke="#DCD4C6" stroke-width="1.4"/><g transform="translate(26 25) scale(0.91)"><rect x="0" y="0" width="42" height="42" rx="10" fill="#F8E9DA" stroke="none" stroke-width="1.4"/><rect x="9" y="12" width="19" height="23" rx="2" fill="none" stroke="#5D584F" stroke-width="1.7"/><path d="M15 7 H28 L35 14 V30 H15 Z" fill="#FFFDF8" stroke="#2C2923" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 7 V14 H35 M20 19 H29 M20 23 H27" fill="none" stroke="#2C2923" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="78" y="41" text-anchor="start" fill="#2C2923" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="19">Você adiciona seus arquivos</text><text x="78" y="65" text-anchor="start" fill="#2C2923" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="19">ao pode abrir</text><path d="M28 81 V319 Q28 328 37 328 H45 M28 149 H45" fill="none" stroke="#A58668" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="149" r="3" fill="#A58668"/><path d="M41 145 L45 149 L41 153 M41 324 L45 328 L41 332" fill="none" stroke="#A58668" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="13" y="231" width="31" height="25" rx="6" fill="#FAF7F0" stroke="none" stroke-width="1.4"/><text x="28" y="248" text-anchor="middle" fill="#A84D23" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="14">ou</text><rect x="50" y="105" width="318" height="136" rx="11" fill="#FFFDF8" stroke="#DCD4C6" stroke-width="1.4"/><g transform="translate(65 119) scale(0.72)"><rect x="0" y="0" width="42" height="42" rx="10" fill="#F8E9DA" stroke="none" stroke-width="1.4"/><path d="M18 18 L22 14 C29 7 38 16 31 23 L27 27 M25 25 L21 29 C14 36 5 27 12 20 L16 16 M17 25 L26 16" fill="none" stroke="#A84D23" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="141" text-anchor="start" fill="#2C2923" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="19">Você envia um link</text><rect x="50" y="262" width="318" height="164" rx="11" fill="#FFFDF8" stroke="#DCD4C6" stroke-width="1.4"/><g transform="translate(65 276) scale(0.72)"><rect x="0" y="0" width="42" height="42" rx="10" fill="#F8E9DA" stroke="none" stroke-width="1.4"/><path d="M7 11 Q7 9 10 9 H32 Q35 9 35 12 V25 Q35 28 32 28 H20 L13 34 V28 H10 Q7 28 7 25 Z" fill="none" stroke="#A84D23" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 18 H28 M21 14 V22" fill="none" stroke="#A84D23" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="298" text-anchor="start" fill="#2C2923" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="19">A pessoa pede acesso</text><text x="66" y="177" text-anchor="start" fill="#5D584F" font-family="Arial, Liberation Sans, sans-serif" font-weight="400" font-size="16">Você escolhe os documentos e gera</text><text x="66" y="200" text-anchor="start" fill="#5D584F" font-family="Arial, Liberation Sans, sans-serif" font-weight="400" font-size="16">um link de curta duração para</text><text x="66" y="223" text-anchor="start" fill="#5D584F" font-family="Arial, Liberation Sans, sans-serif" font-weight="400" font-size="16">enviar à pessoa.</text><text x="66" y="335" text-anchor="start" fill="#5D584F" font-family="Arial, Liberation Sans, sans-serif" font-weight="400" font-size="16">A pessoa solicita acesso pelo endereço</text><text x="66" y="359" text-anchor="start" fill="#2C2923" font-family="Liberation Mono, Courier New, monospace" font-weight="700" font-size="15.5">podeabrir.com/@minhaarroba</text><text x="66" y="390" text-anchor="start" fill="#5D584F" font-family="Arial, Liberation Sans, sans-serif" font-weight="400" font-size="16">Você escolhe quais documentos</text><text x="66" y="412" text-anchor="start" fill="#5D584F" font-family="Arial, Liberation Sans, sans-serif" font-weight="400" font-size="16">liberar.</text><g transform="translate(50 449) scale(0.95)"><path d="M7 2 H17 L13 10 H20 L8 23 L10 14 H4 Z" fill="#F8E9DA" stroke="#A84D23" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="465" text-anchor="start" fill="#2C2923" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="18">Acesso imediato, online</text><text x="83" y="489" text-anchor="start" fill="#2C2923" font-family="Arial, Liberation Sans, sans-serif" font-weight="700" font-size="18">ou presencialmente.</text></svg>
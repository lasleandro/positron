<svg xmlns="http://www.w3.org/2000/svg" width="375" height="457" viewBox="0 182 375 457" role="img" aria-labelledby="titulo descricao" xml:lang="pt-BR"><title id="titulo">Quem pode ler seu documento?</title><desc id="descricao">No seu dispositivo, o documento é criptografado antes do envio. O pode abrir guarda o arquivo cifrado e controla o acesso, sem a chave para ler o conteúdo. O documento é aberto no navegador de quem você autoriza, durante o prazo escolhido.</desc><rect x="0" y="0" width="375" height="639" rx="0" fill="#FBF8F1" stroke="none" stroke-width="2"/><g transform="translate(10 203) scale(0.58)"><rect x="42" y="4" width="59" height="104" rx="9" fill="#E6DECE" stroke="#302F2A" stroke-width="2.7"/><rect x="46" y="9" width="51" height="93" rx="6" fill="#FFFCF6" stroke="#302F2A" stroke-width="1.3"/><rect x="62" y="11" width="20" height="3" rx="1.5" fill="#302F2A" stroke="none" stroke-width="2"/><g transform="translate(55 30) scale(0.91)"><path d="M0 0 H25 L35 10 V47 H0 Z" fill="#FFFCF6" stroke="#302F2A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 0 V10 H35" fill="none" stroke="#302F2A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 20 H25 M7 27 H26 M7 34 H19" fill="none" stroke="#655F55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M65 95 H78" fill="none" stroke="#302F2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="101" cy="82" r="19" fill="#DA773C"/><g transform="translate(92 70) scale(0.72)"><path d="M6 11 V8 A7 7 0 0 1 20 8 V11" fill="none" stroke="#302F2A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="11" width="26" height="21" rx="4" fill="#302F2A" stroke="none" stroke-width="2"/><path d="M10 15 L17 17 V25 L10 27 Z" fill="#FFFCF6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="105" y="202" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#A54B20" text-anchor="start">01</text><text x="105" y="228" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="700" fill="#302F2A" text-anchor="start">No seu dispositivo</text><text x="105" y="256" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="400" fill="#655F55" text-anchor="start">O documento é criptografado</text><text x="105" y="278" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="400" fill="#655F55" text-anchor="start">antes de sair do seu aparelho.</text><path d="M52 279 V313 m-4 -5 4 5 4 -5" fill="none" stroke="#A69B89" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(10 344) scale(0.58)"><path d="M22 36 L36 20 H107 L121 36 V89 H22 Z" fill="#E6DECE" stroke="#302F2A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="36" width="99" height="53" rx="4" fill="#FFFCF6" stroke="#302F2A" stroke-width="2.6"/><path d="M22 61 H121" fill="none" stroke="#302F2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="44" width="5" height="8" rx="2" fill="#DA773C" stroke="none" stroke-width="2"/><rect x="30" y="70" width="5" height="8" rx="2" fill="#DA773C" stroke="none" stroke-width="2"/><path d="M43 48 h6" fill="none" stroke="#655F55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 48 h3" fill="none" stroke="#655F55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 48 h8" fill="none" stroke="#655F55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 48 h4" fill="none" stroke="#655F55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 74 h6" fill="none" stroke="#655F55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 74 h3" fill="none" stroke="#655F55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 74 h8" fill="none" stroke="#655F55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 74 h4" fill="none" stroke="#655F55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="105" cy="48" r="2" fill="#302F2A"/><circle cx="105" cy="74" r="2" fill="#302F2A"/><path d="M30 90 V94 M112 90 V94" fill="none" stroke="#302F2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="343" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#A54B20" text-anchor="start">02</text><text x="105" y="369" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="700" fill="#302F2A" text-anchor="start">No pode abrir</text><text x="105" y="397" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="400" fill="#655F55" text-anchor="start">O serviço guarda o arquivo</text><text x="105" y="419" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="400" fill="#655F55" text-anchor="start">cifrado e controla o acesso.</text><text x="105" y="441" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="400" fill="#655F55" text-anchor="start">A chave de leitura fica fora</text><text x="105" y="463" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="400" fill="#655F55" text-anchor="start">do servidor.</text><path d="M52 420 V454 m-4 -5 4 5 4 -5" fill="none" stroke="#A69B89" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(10 509) scale(0.58)"><rect x="13" y="17" width="113" height="82" rx="6" fill="#FFFCF6" stroke="#302F2A" stroke-width="2.7"/><path d="M13 33 H126" fill="none" stroke="#302F2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="25" r="1.55" fill="#655F55"/><circle cx="27" cy="25" r="1.55" fill="#655F55"/><circle cx="33" cy="25" r="1.55" fill="#655F55"/><g transform="translate(53 42) scale(0.97)"><path d="M0 0 H25 L35 10 V47 H0 Z" fill="#FFFCF6" stroke="#302F2A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 0 V10 H35" fill="none" stroke="#302F2A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 20 H25 M7 27 H26 M7 34 H19" fill="none" stroke="#655F55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="115" cy="83" r="17" fill="#DA773C"/><path d="M107 83 L112 88 L122 77" fill="none" stroke="#302F2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="508" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#A54B20" text-anchor="start">03</text><text x="105" y="534" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="700" fill="#302F2A" text-anchor="start">Na tela de quem recebe</text><text x="105" y="562" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="400" fill="#655F55" text-anchor="start">Quem você autoriza abre o</text><text x="105" y="584" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="400" fill="#655F55" text-anchor="start">documento no navegador,</text><text x="105" y="606" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="400" fill="#655F55" text-anchor="start">pelo tempo que você definir.</text></svg>